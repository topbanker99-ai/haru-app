<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EAED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="할머니의 하루">
<meta property="og:description" content="쓰던 휴대폰 하나로 독거 어르신의 하루를 기록해 가족에게 전하는 돌봄 서비스">
<title>할머니의 하루</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 중앙 단말 1대 — 상단 역할 전환, 하단 탭, 본문만 교체 */
:root{
  --page:#E8EAED; --card:#FFFFFF; --sub-card:#F7F8FA;
  --ink:#191F28; --ink2:#4E5968; --mut:#8B95A1; --line:#EFF1F4;
  --blue:#3182F6; --blue-bg:#E8F2FE; --red:#F04452; --red-bg:#FEECEE;
  --grn:#00BF7A; --grn-bg:#E4F8F0; --amb:#FF9A24; --amb-bg:#FFF3E3;
  --shadow:0 1px 2px rgba(25,31,40,.04), 0 8px 24px rgba(25,31,40,.06);
  --f: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0E0F12; --card:#1A1C20; --sub-card:#232529;
  --ink:#EDEFF2; --ink2:#AEB5BE; --mut:#79818C; --line:#2A2D33;
  --blue:#4C92FF; --blue-bg:#17283F; --red:#FF6A74; --red-bg:#3A1F23;
  --grn:#1FD494; --grn-bg:#10322A; --amb:#FFB15C; --amb-bg:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --page:#0E0F12; --card:#1A1C20; --sub-card:#232529;
  --ink:#EDEFF2; --ink2:#AEB5BE; --mut:#79818C; --line:#2A2D33;
  --blue:#4C92FF; --blue-bg:#17283F; --red:#FF6A74; --red-bg:#3A1F23;
  --grn:#1FD494; --grn-bg:#10322A; --amb:#FFB15C; --amb-bg:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0; padding:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--page); color:var(--ink); font-family:var(--f); -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:22px 28px; display:flex; flex-direction:column; align-items:center; gap:14px}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
h1,h2,h3,h4,h5{margin:0; letter-spacing:-.025em; text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ── 단말 ─────────────────────────────── */
.phone{width:100%; max-width:392px; background:var(--card); border-radius:30px; box-shadow:var(--shadow);
  overflow:hidden; display:flex; flex-direction:column; height:min(812px, calc(100dvh - 92px)); min-height:600px;
  border:1px solid var(--line)}
.sbar{display:flex; justify-content:space-between; align-items:center; padding:9px 20px 2px; font-size:12px; font-weight:700; color:var(--ink); letter-spacing:0}
.sbar .ic{letter-spacing:1px; font-size:10px; color:var(--ink2)}

/* 앱바 + 역할 전환 */
.appbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 16px 12px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand .mk{width:28px; height:28px; border-radius:9px; background:var(--grn-bg); display:grid; place-items:center; flex:0 0 auto}
.brand .mk svg{width:16px; height:16px}
.brand b{font-size:15px; font-weight:800; letter-spacing:-.03em; white-space:nowrap}
.brand span{display:block; font-size:10.5px; color:var(--mut); font-weight:500; margin-top:-1px}
.seg{position:relative; display:flex; background:var(--sub-card); border-radius:999px; padding:3px; flex:0 0 auto}
.seg i{position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:calc(100% - 6px); border-radius:999px;
  background:var(--card); box-shadow:0 1px 3px rgba(25,31,40,.14); transition:transform .26s cubic-bezier(.3,1.2,.4,1)}
[data-role="youth"] .seg i{transform:translateX(100%)}
.seg button{position:relative; z-index:1; font-size:12px; font-weight:700; padding:6px 13px; border-radius:999px;
  color:var(--mut); transition:color .2s; letter-spacing:-.02em}
[data-role="family"] .seg button[data-role="family"],
[data-role="youth"] .seg button[data-role="youth"]{color:var(--ink)}

/* 본문 */
.view{flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 15px 11px; display:flex; flex-direction:column; gap:10px;
  scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.pg{display:flex; flex-direction:column; gap:9px; animation:fade .28s ease both}
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .pg{animation:none} .seg i{transition:none} }

.ttlrow{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:0 2px}
.ttlrow .dt{font-size:11.5px; color:var(--mut); font-weight:600}
.ttlrow h2{font-size:19.5px; font-weight:800; line-height:1.25}

/* 카드 */
.c{background:var(--card); border:1px solid var(--line); border-radius:17px; padding:13px}
.c.flat{background:var(--sub-card); border-color:transparent}
.c h5{font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.c p{font-size:13px; line-height:1.62; color:var(--ink2)}
.c p+p{margin-top:7px}
.c .big{font-size:18px; font-weight:800; color:var(--ink); line-height:1.38; letter-spacing:-.03em; margin-bottom:6px}

.hero{border-radius:20px; padding:12px 14px; display:flex; gap:11px; align-items:center; border:1px solid transparent}
.hero.ok{background:var(--grn-bg)} .hero.warn{background:var(--amb-bg)} .hero.bad{background:var(--red-bg)}
.hero .tx{min-width:0; flex:1}
.hero .k{font-size:11px; font-weight:800; letter-spacing:.02em; margin-bottom:5px}
.hero.ok .k{color:var(--grn)} .hero.warn .k{color:var(--amb)} .hero.bad .k{color:var(--red)}
.hero h3{font-size:17.5px; font-weight:800; line-height:1.32; margin-bottom:4px}
.hero p{font-size:12.5px; color:var(--ink2); line-height:1.55}
.hero img{width:62px; height:62px; flex:0 0 auto; object-fit:contain}

/* 리스트 */
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; font-size:13px; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0; padding-top:0}
.row b{font-weight:500; color:var(--ink2)}
.row span{font-weight:700; text-align:right; letter-spacing:-.02em}
.sig{display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; border-top:1px solid var(--line)}
.sig:first-child{border-top:0; padding-top:0}
.sig .dot{width:7px; height:7px; border-radius:50%; background:var(--grn); flex:0 0 auto}
.sig .dot.off{background:var(--mut); opacity:.45}
.sig .nm{flex:1; color:var(--ink2); font-weight:500}
.sig .vl{color:var(--mut); font-size:11.5px; font-weight:700}

.tag{display:inline-block; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:7px; letter-spacing:-.01em}
.t-g{background:var(--grn-bg); color:var(--grn)} .t-a{background:var(--amb-bg); color:var(--amb)}
.t-r{background:var(--red-bg); color:var(--red)} .t-b{background:var(--blue-bg); color:var(--blue)}
.t-n{background:var(--sub-card); color:var(--mut)}

/* 버튼 */
.b{display:block; width:100%; border-radius:14px; padding:11px 14px; font-size:15px; font-weight:800; letter-spacing:-.03em;
  text-align:center; transition:transform .12s, filter .15s}
.b:active{transform:scale(.985); filter:brightness(.96)}
.b small{display:block; font-size:11.5px; font-weight:500; opacity:.82; margin-top:3px; letter-spacing:0}
.b.red{background:var(--red); color:#fff} .b.blu{background:var(--blue); color:#fff}
.b.grn{background:var(--grn); color:#fff}
.b.gho{background:var(--sub-card); color:var(--ink2)}
.bb{display:flex; gap:9px} .bb .b{flex:1}

/* 신호 24시간 띠 */
.tl{display:flex; flex-direction:column; gap:6px; margin-top:0}
.tl .r{display:flex; align-items:center; gap:9px}
.tl .lb{width:52px; font-size:11px; font-weight:700; color:var(--mut); flex:0 0 auto}
.tl .tk{flex:1; height:13px; border-radius:6px; background:var(--sub-card); position:relative; overflow:hidden}
.tl .tk i{position:absolute; top:0; bottom:0; border-radius:4px; background:var(--grn); opacity:.85}
.tl .tk i.b2{background:var(--blue)} .tl .tk i.a2{background:var(--amb)} .tl .tk i.g2{background:var(--mut); opacity:.3}
.tlx{display:flex; justify-content:space-between; font-size:10px; color:var(--mut); font-weight:600; padding-left:61px; margin-top:3px}

/* 주간 막대 */
.wk{display:flex; align-items:flex-end; gap:6px; height:74px; margin-top:4px}
.wk div{flex:1; border-radius:6px 6px 3px 3px; background:var(--grn); opacity:.85}
.wk div.a{background:var(--amb)} .wk div.r{background:var(--red)}
.wkl{display:flex; gap:6px; margin-top:6px}
.wkl span{flex:1; text-align:center; font-size:10.5px; color:var(--mut); font-weight:600}

/* 기상 시각 점 그래프 */
.dotc{position:relative; height:66px; margin:6px 0 2px}
.dotc .base{position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--line)}
.dotc .p{position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:var(--blue)}
.dotc .p.a{background:var(--amb); width:11px; height:11px; margin:-5.5px 0 0 -5.5px}

/* 지도 */
.map{height:132px; border-radius:16px; background:
  repeating-linear-gradient(90deg, transparent 0 25px, var(--line) 25px 26px),
  repeating-linear-gradient(0deg, transparent 0 25px, var(--line) 25px 26px), var(--sub-card);
  position:relative; overflow:hidden}
.map svg.rt{position:absolute; inset:0; width:100%; height:100%}
.map .pin{position:absolute; width:13px; height:13px; border-radius:50%; border:3px solid var(--card)}
.map .pin.go{background:var(--red); left:74%; top:26%}
.map .pin.me{background:var(--blue); left:18%; top:69%; animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(49,130,246,.42)} 50%{box-shadow:0 0 0 11px rgba(49,130,246,0)}}
.map .cap{position:absolute; right:9px; bottom:8px; font-size:10px; font-weight:700; color:var(--mut); background:var(--card);
  padding:3px 8px; border-radius:7px}

/* 진행 단계 */
.prog{display:flex; gap:5px}
.prog i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.prog i.on{background:var(--blue)}

/* 호출 카드 (청년) */
.call{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:9px 12px; display:flex; flex-direction:column; gap:3px;
  text-align:left; width:100%; transition:transform .12s}
.call .ft .cnt{font-size:11px; font-weight:700; color:var(--mut)}
.call .ft .cnt b{color:var(--blue)}
.call:active{transform:scale(.99)}
.call .top{display:flex; justify-content:space-between; align-items:center}
.call .km{font-size:11.5px; color:var(--mut); font-weight:700}
.call h5{font-size:14.5px; font-weight:800; color:var(--ink); margin:0; display:block}
.call p{font-size:11px; color:var(--ink2); line-height:1.4}
.call .ft{display:flex; justify-content:space-between; align-items:baseline; margin-top:2px}
.call .fee{font-size:14px; font-weight:800; letter-spacing:-.03em}
.call .take{font-size:12px; font-weight:800; color:var(--blue)}

/* 체크 */
.chk{display:flex; gap:11px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); width:100%; text-align:left}
.chk:first-child{border-top:0}
.chk .bx{width:21px; height:21px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; margin-top:1px;
  display:grid; place-items:center; transition:.16s}
.chk.on .bx{background:var(--blue); border-color:var(--blue)}
.chk .bx svg{width:11px; height:11px; opacity:0}
.chk.on .bx svg{opacity:1}
.chk .tx b{display:block; font-size:13.5px; font-weight:700; margin-bottom:2px}
.chk .tx span{font-size:12px; color:var(--mut); line-height:1.5}

/* 링 / 도넛 */
.ring{display:flex; align-items:center; gap:15px}
.ring svg{width:76px; height:76px; flex:0 0 auto; transform:rotate(-90deg)}
.ring .vv{font-size:25px; font-weight:800; letter-spacing:-.04em}
.ring .kk{font-size:12px; color:var(--mut); font-weight:600; margin-top:2px}

/* 지원 카테고리 그리드 */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px}
.opt{background:var(--sub-card); border-radius:15px; padding:13px 12px; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt .ic{font-size:21px; line-height:1}
.opt b{font-size:13.5px; font-weight:700; display:block; letter-spacing:-.02em}
.opt span{font-size:11px; color:var(--mut); font-weight:600}

.note{font-size:10.5px; line-height:1.55; color:var(--mut); background:var(--sub-card); border-radius:12px; padding:8px 11px}
.note b{color:var(--ink2); font-weight:700}

/* 탭바 */
.tabs{display:flex; border-top:1px solid var(--line); padding:7px 8px calc(9px + env(safe-area-inset-bottom,0px)); background:var(--card)}
.tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 1px; font-size:9.5px; font-weight:700; color:var(--mut); letter-spacing:-.03em}
.tabs button svg{width:19px; height:19px}
.tabs button.on{color:var(--blue)}

/* 바텀시트 */
.sheet{position:absolute; inset:0; background:rgba(15,18,22,.42); display:flex; align-items:flex-end; z-index:20; animation:fade .2s}
.sheet .inner{background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:12px; animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)} to{transform:none}}
.sheet h5{font-size:17px; font-weight:800}
.sheet .sub{font-size:12.5px; color:var(--mut); margin-top:-6px}
.wrapper{position:relative; width:100%; max-width:392px; display:flex}

/* 상태 칩 */
.states{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.states button{display:flex; align-items:center; justify-content:center; gap:5px; padding:8px 4px; border-radius:11px;
  background:var(--sub-card); font-size:11.5px; font-weight:800; color:var(--mut); border:1.5px solid transparent; letter-spacing:-.02em}
.states button i{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55}
.states button.g{color:var(--grn)} .states button.n{color:var(--mut)}
.states button.a{color:var(--amb)} .states button.r{color:var(--red)}
.states button.on i{opacity:1}
.states button.on.g{background:var(--grn-bg); border-color:var(--grn)}
.states button.on.n{background:var(--sub-card); border-color:var(--mut)}
.states button.on.a{background:var(--amb-bg); border-color:var(--amb)}
.states button.on.r{background:var(--red-bg); border-color:var(--red)}

/* 등급 · 센서 */
.gr{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px}
.gr.g1{background:var(--grn-bg); color:var(--grn)} .gr.g2{background:var(--blue-bg); color:var(--blue)}
.gr.g3{background:var(--red-bg); color:var(--red)}
.call.lock{opacity:.52}
.call.lock .take{color:var(--mut)}
.gcard{border:1.8px solid var(--blue); background:var(--blue-bg); border-radius:17px; padding:14px}
.gcard .gt2{font-size:11px; font-weight:800; color:var(--blue); letter-spacing:.02em}
.gcard h4{font-size:19px; font-weight:800; margin-top:4px; letter-spacing:-.03em}
.gcard p{font-size:12px; color:var(--ink2); line-height:1.5; margin-top:5px}
.sens{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line); font-size:12.5px}
.sens:first-of-type{border-top:0; padding-top:0}
.sens .ic2{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:0 0 auto; font-size:13px}
.sens .ic2.on{background:var(--grn-bg)} .sens .ic2.off{background:var(--sub-card)}
.sens .sn{flex:1; min-width:0; font-weight:600; color:var(--ink2)}
.sens .sn em{display:block; font-style:normal; font-size:10.5px; color:var(--mut); margin-top:1px}
.sens .sv{font-size:11.5px; font-weight:800; white-space:nowrap}
.sim{display:inline-block; font-size:9.5px; font-weight:800; color:var(--amb); background:var(--amb-bg); padding:2px 6px; border-radius:5px; margin-left:5px}
.flow{display:flex; flex-direction:column; gap:0; margin-top:4px}
.flow .fs{display:flex; gap:10px; align-items:flex-start; padding:9px 0}
.flow .fn{width:22px; height:22px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
  font-size:11px; font-weight:800; background:var(--sub-card); color:var(--mut)}
.flow .fs.on .fn{background:var(--blue); color:#fff}
.flow .fs.hot .fn{background:var(--red); color:#fff}
.flow .fb{flex:1; min-width:0}
.flow .fb b{font-size:13px; font-weight:700; display:block}
.flow .fb span{font-size:11.5px; color:var(--mut); line-height:1.45; display:block; margin-top:2px}

/* 친구 초대 */
.inv{background:linear-gradient(135deg,var(--blue-bg),var(--grn-bg)); border:1.5px solid var(--blue); border-radius:17px; padding:14px}
.inv h5{font-size:13.5px; font-weight:800; color:var(--blue); margin-bottom:5px}
.inv p{font-size:12px; color:var(--ink2); line-height:1.55}
.inv .lk{display:flex; gap:7px; align-items:center; margin-top:10px; background:var(--card); border-radius:11px; padding:9px 11px}
.inv .lk span{flex:1; min-width:0; font-size:11px; color:var(--mut); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.inv .lk b{font-size:11.5px; font-weight:800; color:var(--blue); flex:0 0 auto}
.share{display:flex; gap:7px; margin-top:9px}
.share button{flex:1; padding:11px 4px; border-radius:12px; font-size:12.5px; font-weight:800; letter-spacing:-.02em}
.share .kk2{background:#FEE500; color:#191600}
.share .ln2{background:var(--sunkk,var(--sub-card)); color:var(--ink2)}
.buddy{display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--line)}
.buddy:first-of-type{border-top:0; padding-top:0}
.buddy img{width:34px; height:34px; border-radius:50%; flex:0 0 auto}
.buddy .bn{flex:1; min-width:0; font-size:12.5px; font-weight:700}
.buddy .bn span{display:block; font-size:10.5px; color:var(--mut); font-weight:600; margin-top:1px}
.buddy .bv{font-size:11.5px; font-weight:800; color:var(--blue); white-space:nowrap}

/* 제출 서류 */
.doc{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line)}
.doc:first-child{border-top:0; padding-top:0}
.doc .st2{width:17px; height:17px; border-radius:6px; flex:0 0 auto; margin-top:2px; display:grid; place-items:center; font-size:10px; font-weight:900}
.doc .st2.ok{background:var(--grn); color:#fff}
.doc .st2.no{background:var(--sub-card); color:var(--mut); border:1.5px solid var(--line)}
.doc .dd2{flex:1; min-width:0}
.doc .dd2 b{font-size:13px; font-weight:700; display:block}
.doc .dd2 span{font-size:11px; color:var(--mut); line-height:1.45; display:block; margin-top:2px}
.doc .req{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; flex:0 0 auto; margin-top:2px}
.req.must{background:var(--red-bg); color:var(--red)} .req.opt{background:var(--sub-card); color:var(--mut)}

/* 요금제 · 가입 */
.plan{border:1.8px solid var(--line); border-radius:17px; padding:14px; background:var(--card)}
.plan.hl{border-color:var(--blue); background:var(--blue-bg)}
.plan .ph{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.plan .pn{font-size:15px; font-weight:800; letter-spacing:-.03em}
.plan .pb{font-size:10px; font-weight:800; color:var(--blue); background:var(--card); padding:3px 7px; border-radius:6px}
.plan .pp{font-size:24px; font-weight:800; letter-spacing:-.04em; margin-top:7px}
.plan .pp span{font-size:12.5px; font-weight:700; color:var(--mut)}
.plan ul{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.plan li{font-size:12px; color:var(--ink2); line-height:1.45; padding-left:17px; position:relative}
.plan li::before{content:""; position:absolute; left:0; top:6px; width:9px; height:5px; border-left:2px solid var(--blue);
  border-bottom:2px solid var(--blue); transform:rotate(-45deg)}
.sso{display:flex; flex-direction:column; gap:7px}
.sso button{display:flex; align-items:center; justify-content:center; gap:7px; padding:12px; border-radius:13px;
  font-size:14px; font-weight:800; letter-spacing:-.02em}
.sso .kk{background:#FEE500; color:#191600}
.sso .nn{background:#03C75A; color:#fff}
.sso .pp2{background:var(--sub-card); color:var(--ink2)}
.grade{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line)}
.grade:first-child{border-top:0; padding-top:0}
.grade .gb{width:48px; text-align:center; font-size:11px; font-weight:800; padding:3px 0; border-radius:7px; flex:0 0 auto}
.grade .gt{flex:1; font-size:12px; color:var(--ink2); line-height:1.45}
.grade .gv{font-size:12.5px; font-weight:800; letter-spacing:-.02em; white-space:nowrap}

/* 평가 */
.stars{display:flex; gap:3px; margin-top:5px}
.stars button{padding:1px; line-height:0}
.stars svg{width:24px; height:24px}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tags button{font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:999px; background:var(--sub-card);
  color:var(--mut); border:1.5px solid transparent; transition:.14s}
.tags button.on{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}
.yn{display:flex; gap:6px; margin-top:6px}
.yn button{flex:1; padding:8px; border-radius:10px; background:var(--sub-card); font-size:12.5px; font-weight:800;
  color:var(--mut); border:1.5px solid transparent}
.yn button.on.y{background:var(--grn-bg); color:var(--grn); border-color:var(--grn)}
.yn button.on.n{background:var(--red-bg); color:var(--red); border-color:var(--red)}
.q{padding:11px 0; border-top:1px solid var(--line)}
.q:first-child{border-top:0; padding-top:0}
.q .qt{font-size:13px; font-weight:700}
.delta{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800}
.delta .up{color:var(--blue)}

/* 정기 호출 */
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:4px}
.days button{padding:9px 0; border-radius:10px; background:var(--sub-card); font-size:12px; font-weight:800;
  color:var(--mut); border:1.5px solid transparent}
.days button.on{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}
.opts{display:flex; gap:6px; margin-top:4px}
.opts button{flex:1; padding:9px 4px; border-radius:10px; background:var(--sub-card); font-size:12px; font-weight:700;
  color:var(--mut); border:1.5px solid transparent}
.opts button.on{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}

/* 난이도 · 가산 */
.diff{font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px; letter-spacing:-.01em}
.diff.d1{background:var(--grn-bg); color:var(--grn)}
.diff.d2{background:var(--amb-bg); color:var(--amb)}
.diff.d3{background:var(--red-bg); color:var(--red)}
.bns{display:inline-block; font-size:10px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:2px 6px; border-radius:6px; margin-left:5px}

/* 신청 청년 카드 */
.app{display:flex; gap:11px; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line);
  border-radius:16px; padding:12px; transition:.14s}
.app.on{border-color:var(--blue); background:var(--blue-bg)}
.app img{width:46px; height:46px; border-radius:50%; flex:0 0 auto}
.app .bd{flex:1; min-width:0}
.app .nm{display:flex; align-items:baseline; gap:6px}
.app .nm b{font-size:14.5px; font-weight:800; letter-spacing:-.02em}
.app .nm span{font-size:11px; color:var(--mut); font-weight:600}
.app .mj{font-size:11.5px; color:var(--ink2); margin-top:2px; font-weight:500}
.temp{display:flex; align-items:center; gap:7px; margin-top:7px}
.temp .bar{flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.temp .bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--grn),var(--blue))}
.temp .vv{font-size:12.5px; font-weight:800; letter-spacing:-.03em; color:var(--blue)}
.caps{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px}
.caps span{font-size:10px; font-weight:700; color:var(--ink2); background:var(--sub-card); padding:3px 7px; border-radius:6px}
.app .mt{display:flex; gap:10px; margin-top:7px; font-size:10.5px; color:var(--mut); font-weight:700}
.app .pk{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; align-self:center;
  display:grid; place-items:center}
.app.on .pk{background:var(--blue); border-color:var(--blue)}
.app .pk svg{width:11px; height:11px; opacity:0}
.app.on .pk svg{opacity:1}

/* 주간 캘린더 */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .d{display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 1px 6px; border-radius:10px;
  background:var(--sub-card); border:1.5px solid transparent; transition:.14s}
.cal .d.sel{border-color:var(--ink); background:var(--card)}
.cal .dw{font-size:9.5px; font-weight:700; color:var(--mut)}
.cal .dd{font-size:13px; font-weight:800; line-height:1}
.cal .st{width:16px; height:4px; border-radius:2px}
.cal .st.g{background:var(--grn)} .cal .st.n{background:var(--mut); opacity:.45}
.cal .st.a{background:var(--amb)} .cal .st.r{background:var(--red)}
.legend{max-width:392px; font-size:11.5px; line-height:1.65; color:var(--mut); text-align:center}
.legend b{color:var(--ink2)}

/* ── 모바일: 전체화면 ───────────────────── */
@media (max-width: 560px){
  html{height:100%}
  body{height:100vh; height:100dvh; overflow:hidden;
    padding-left:0; padding-right:0; padding-block:0; gap:0}
  .wrapper{max-width:none; flex:1 1 auto; min-height:0}
  .phone{max-width:none; border-radius:0; border:0; box-shadow:none;
    height:100%; min-height:0}
  .sbar{padding-top:max(9px, env(safe-area-inset-top, 0px))}
  .legend{flex:0 0 auto; max-width:none; font-size:11px; line-height:1.55;
    padding:8px max(14px, env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom, 0px));
    background:var(--card); border-top:1px solid var(--line)}
}
</style>
</head>

/* 24시간 신호 띠 */
function timeline(rows){
  var h='<div class="tl">';
  rows.forEach(function(r){
    h+='<div class="r"><span class="lb">'+r[0]+'</span><div class="tk">';
    r[1].forEach(function(s){
      h+='<i class="'+(s[2]||'')+'" style="left:'+(s[0]/24*100).toFixed(1)+'%;width:'+(s[1]/24*100).toFixed(1)+'%"></i>';
    });
    h+='</div></div>';
  });
  return h+'</div><div class="tlx"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>';
}

function renderTabs(){
  TB.innerHTML=TABS[role].map(function(t){
    var on=(t[0]===tab || TABOF[tab]===t[0]);
    return '<button data-tab="'+t[0]+'" class="'+(on?'on':'')+'">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICON[t[2]]+'</svg>'+t[1]+'</button>'}).join('');
}
function render(){
  A.dataset.role=role;
  document.getElementById('roleSub').textContent = role==='family' ? '가족용 · 박순자 님' : '청년용 · 괴산읍 2조';
  V.innerHTML='<div class="pg">'+PAGES[tab]()+'</div>';
  V.scrollTop=0; renderTabs();
}
function go(t){ tab=t; render() }
function setRole(r){ if(r===role) return; role=r; tab=(r==='family'?'home':'list'); cur=null; checked={}; rateSent=false; yrateSent=false; regSent=false; render() }

document.addEventListener('click', function(e){
  var t=e.target.closest('[data-role],[data-tab],[data-go],[data-open],[data-state],[data-sheet],[data-cat],[data-call],[data-chk],[data-close],[data-pick],[data-auto],[data-star],[data-rtag],[data-rsend],[data-ya],[data-ysend],[data-regd],[data-regt],[data-regw],[data-regsend],[data-share],[data-copy]');
  if(!t) return;
  if(t.dataset.role) return setRole(t.dataset.role);
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.state){ state=t.dataset.state; selDay = t.dataset.day ? +t.dataset.day : (DEFDAY[state]||0); return render() }
  if(t.dataset.open){ cur=t.dataset.open; checked={}; yans={}; yrateSent=false; return go('detail') }
  if(t.dataset.chk!==undefined){ checked[t.dataset.chk]=!checked[t.dataset.chk]; return go('check') }
  if(t.dataset.sheet) return openSheet();
  if(t.dataset.close) { SH.hidden=true; return }
  if(t.dataset.cat){ supCat=t.dataset.cat; supKind='sup'; SH.hidden=true; return go('sup') }
  if(t.dataset.call){ supKind=(t.dataset.call==='emg')?'emg':'sup'; picked=[]; stars={}; rtags=[]; rateSent=false; return go('sent') }
  if(t.dataset.pick){ var i=picked.indexOf(t.dataset.pick);
    if(i>=0) picked.splice(i,1); else { if(picked.length>=2) picked.shift(); picked.push(t.dataset.pick) }
    return go('apply') }
  if(t.dataset.auto){ picked=['y1','y2']; return go('sent') }
  if(t.dataset.star){ stars[t.dataset.star]=+t.dataset.n; return go('rate') }
  if(t.dataset.rtag){ var k=rtags.indexOf(t.dataset.rtag); if(k>=0) rtags.splice(k,1); else rtags.push(t.dataset.rtag); return go('rate') }
  if(t.dataset.rsend){ rateSent=true; return go('rate') }
  if(t.dataset.ya!==undefined){ yans[t.dataset.ya]=t.dataset.v; return go('yrate') }
  if(t.dataset.ysend){ yrateSent=true; return go('yrate') }
  if(t.dataset.regd){ var j=regDays.indexOf(t.dataset.regd); if(j>=0){ if(regDays.length>1) regDays.splice(j,1) } else regDays.push(t.dataset.regd);
    regDays.sort(function(a,b){return DAYS.indexOf(a)-DAYS.indexOf(b)}); return go('reg') }
  if(t.dataset.regt){ regTime=t.dataset.regt; return go('reg') }
  if(t.dataset.regw){ regWeeks=+t.dataset.regw; return go('reg') }
  if(t.dataset.regsend){ regSent=true; return go('reg') }
  if(t.dataset.share||t.dataset.copy){ invited=true; return go('detail') }
  if(t.dataset.go){ if(t.dataset.go==='sent' && picked.length<2 && t.closest('[data-go=\"sent\"]')) { } return go(t.dataset.go) }
});
function openSheet(){
  SH.innerHTML='<div class="inner"><h5>무엇을 도와드릴까요</h5>'+

   Object.keys(FEE).map(function(k){var f=FEE[k];
     return '<button class="opt" data-cat="'+k+'"><span class="ic">'+f[3]+'</span><b>'+k+'</b><span class="num">'+f[0]+'</span></button>'}).join('')+
   '</div><button class="b gho" data-close="1">닫기</button></div>';
  SH.hidden=false;
}
SH.addEventListener('click', function(e){ if(e.target===SH) SH.hidden=true });
